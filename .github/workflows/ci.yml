name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Offline: no secrets, no model downloads, no LLM calls.
      SANDFISH_OMPA_SEMANTIC: "0"
      SANDFISH_AUDIT_DEPENDENCIES: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev,llm,mcp]'
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q
