[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sandfish"
version = "0.2.0"
description = "Multi-agent simulation platform with OMPA memory, a FastAPI service, an MCP server, and optional LLM agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Jeff Milam"}
]
keywords = ["multi-agent", "swarm", "simulation", "ai", "ompa", "mcp", "fastapi", "llm-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "ompa>=1.1.1,<2",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Embedding-backed hybrid search (downloads a sentence-transformers model).
semantic = ["ompa[semantic]>=1.1.1,<2"]
# Optional LLM agent providers (Anthropic, Gemini, OpenRouter) over HTTP.
llm = ["httpx>=0.24.0"]
# MCP server (`sandfish-mcp`, stdio) on the official Python MCP SDK.
mcp = ["mcp>=2.3,<3"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
sandfish = "sandfish.cli:main"
sandfish-mcp = "sandfish.mcp_server:main"

[project.urls]
Homepage = "https://github.com/jmiaie/sandfish"
Repository = "https://github.com/jmiaie/sandfish"
Documentation = "https://github.com/jmiaie/sandfish#readme"
Changelog = "https://github.com/jmiaie/sandfish/blob/main/CHANGELOG.md"
Issues = "https://github.com/jmiaie/sandfish/issues"

[tool.hatch.build.targets.wheel]
packages = ["sandfish"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
